name: Obsidian integrity

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-vault:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Obsidian Vault
        run: python scripts/check_vault.py

      - name: Check review metadata
        run: python scripts/report_review_queue.py --check --limit 0
